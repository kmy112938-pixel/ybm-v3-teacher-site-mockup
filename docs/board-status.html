<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Y클라우드 게시판 현황판</title>
<style>
  :root{
    --navy:#1B2A4A;
    --navy-soft:#2E4270;
    --teal:#2F8F9D;
    --amber:#D98A2B;
    --rose:#C2554A;
    --bg:#F5F6F8;
    --card:#FFFFFF;
    --line:#E3E6EC;
    --text:#26324A;
    --sub:#6B7488;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    line-height:1.55;padding:40px 20px 80px;
  }
  .wrap{max-width:900px;margin:0 auto;}

  header{border-bottom:3px solid var(--navy);padding-bottom:18px;margin-bottom:8px;}
  header .eyebrow{font-size:14px;letter-spacing:.12em;color:var(--teal);font-weight:700;margin-bottom:6px;}
  h1{font-size:26px;margin:0 0 8px;color:var(--navy);letter-spacing:-0.01em;}
  .purpose{font-size:16px;color:var(--text);background:#EFF3FA;border-left:4px solid var(--navy);padding:12px 16px;border-radius:4px;margin:14px 0 0;}
  .meta{font-size:14.5px;color:var(--sub);margin-top:10px;}
  .sync-badge{display:inline-flex;align-items:center;gap:6px;}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:#2E9D5F;display:inline-block;}

  h2.section{font-size:17px;color:var(--navy);margin:30px 0 12px;display:flex;align-items:center;gap:8px;}
  h2.section::before{content:"";width:4px;height:15px;background:var(--teal);border-radius:2px;display:inline-block;}
  .section-desc{font-size:14.5px;color:var(--sub);margin:-6px 0 14px;}

  .team-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:28px;}
  .team-card{
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:16px 18px;box-shadow:0 1px 3px rgba(20,30,60,.04);
  }
  .team-card .name{font-weight:700;color:var(--navy);font-size:16.5px;}
  .team-card .name small{font-weight:400;color:var(--sub);font-size:13.5px;margin-left:4px;}
  .team-card .row{display:flex;justify-content:space-between;font-size:14.5px;margin-top:10px;color:var(--sub);}
  .team-card .row b{color:var(--text);font-weight:600;}

  details{
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    margin-bottom:14px;overflow:hidden;
  }
  summary{
    cursor:pointer;padding:15px 20px;font-size:15.5px;font-weight:700;color:var(--navy);
    list-style:none;display:flex;justify-content:space-between;align-items:center;
  }
  summary::-webkit-details-marker{display:none;}
  summary::after{content:"펼치기 ▾";font-size:14px;font-weight:600;color:var(--teal);}
  details[open] summary::after{content:"접기 ▴";}
  details[open] summary{border-bottom:1px solid var(--line);}
  .details-body{padding:16px 20px 20px;font-size:15px;}

  /* Level tabs */
  .level-tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--line);}
  .level-tab{
    font-family:inherit;font-size:15px;font-weight:600;color:var(--sub);
    background:none;border:none;padding:9px 4px;margin-right:14px;cursor:pointer;
    border-bottom:2px solid transparent;
  }
  .level-tab.active{color:var(--navy);border-bottom-color:var(--teal);}
  .level-tab .cnt{font-size:13px;font-weight:600;color:var(--sub);margin-left:3px;}
  .empty-state{padding:26px 10px;text-align:center;color:var(--sub);font-size:14.5px;}

  /* Sub filters */
  .sub-filters{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-bottom:16px;flex-wrap:wrap;}
  .sub-filters label{font-size:14px;color:var(--sub);font-weight:600;}
  .sub-filters select{
    font-family:inherit;font-size:14.5px;padding:6px 9px;border-radius:6px;border:1px solid var(--line);
    background:#fff;color:var(--text);
  }
  .sub-filters .reset-btn{
    font-size:14px;color:var(--teal);background:none;border:none;cursor:pointer;font-weight:600;
    padding:6px 4px;
  }
  .no-match{padding:16px 10px;text-align:center;color:var(--sub);font-size:14px;}

  .group{margin-bottom:16px;}
  .group-title{font-size:14.5px;font-weight:700;color:var(--navy-soft);margin:14px 0 6px;padding-bottom:4px;border-bottom:1px dashed var(--line);}
  table{width:100%;border-collapse:collapse;font-size:14.5px;}
  thead th{background:#F0F2F6;color:var(--sub);font-weight:700;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
  tbody td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}
  .content-name{font-weight:700;color:var(--navy);}
  .num{text-align:right;font-variant-numeric:tabular-nums;}
  .muted{color:var(--sub);}

  tr.item-row{cursor:pointer;}
  tr.item-row:hover td{background:#F6F8FB;}
  tr.item-row td.chev{width:16px;color:var(--sub);text-align:center;font-size:13px;transition:transform .15s;}
  tr.item-row.open td.chev{transform:rotate(90deg);}

  .badge{display:inline-block;font-size:13px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap;}
  .badge.live{background:#E5F4EC;color:#268A55;}
  .badge.prep{background:#F1F2F5;color:var(--sub);}

  tr.hist-row{display:none;background:#FAFBFD;}
  tr.hist-row.open{display:table-row;}
  tr.hist-row td{padding:14px 16px 16px 30px;border-bottom:1px solid var(--line);}
  .timeline{list-style:none;margin:0;padding:0;}
  .timeline li{position:relative;padding:0 0 10px 18px;border-left:2px solid var(--line);}
  .timeline li:last-child{border-left:2px solid transparent;padding-bottom:0;}
  .timeline li::before{content:"";position:absolute;left:-5px;top:2px;width:8px;height:8px;border-radius:50%;background:var(--teal);}
  .t-date{font-size:13px;color:var(--sub);}
  .t-head{display:flex;align-items:center;gap:8px;margin:2px 0;}
  .t-action{font-size:14.5px;font-weight:600;color:var(--text);}
  .t-who{font-size:13px;color:var(--sub);}
  .etype{font-size:12.5px;font-weight:700;padding:2px 7px;border-radius:20px;white-space:nowrap;}
  .etype.create{background:#E7F1FF;color:#1F5FBF;}
  .etype.edit{background:#FBEEE3;color:var(--amber);}
  .etype.delete{background:#FDECEA;color:var(--rose);}
  .unknown{color:var(--sub);font-style:italic;}

  footer{margin-top:30px;font-size:13.5px;color:var(--sub);text-align:center;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">Y클라우드 · CONTENT OPS</div>
    <h1>Y클라우드 게시판 현황판</h1>
    <div class="purpose">
      과목별 게시판에 올라간 자료 현황을 공유하는 페이지입니다. 각 항목을 클릭하면 그 게시판이 언제 생성·수정됐는지 이력을 볼 수 있어요.
    </div>
    <div class="meta sync-badge" id="metaLine"><span class="sync-dot"></span></div>
  </header>

  <h2 class="section">과목별 최근 반영 현황</h2>
  <p class="section-desc">각 팀에서 최근 사이트에 반영된 자료 기준입니다. (학교급·과목 순 정렬, 게시중 상태만 집계)</p>
  <div class="team-grid" id="teamGrid"></div>

  <details open>
    <summary id="listSummary">게시판별 콘텐츠 목록 · 클릭하면 변경 이력이 펼쳐져요</summary>
    <div class="details-body">

      <div class="level-tabs" id="levelTabs"></div>

      <div class="sub-filters">
        <label for="subjectFilter">과목</label>
        <select id="subjectFilter"><option value="all">전체</option></select>
        <label for="gradeFilter">학년</label>
        <select id="gradeFilter"><option value="all">전체</option></select>
      </div>

      <div id="groupsContainer"></div>

    </div>
  </details>

  <footer id="footerLine"></footer>

</div>

<script>
const DATA = [{"id": "BRD-001", "level": "초등", "subject": "영어", "grade": "3학년", "board": "교과서 자료 > 단원별 자료", "name": "영어 3 김혜리", "type": "수업 PPT", "count": null, "status": "prep", "last_update": null, "history": [{"date": null, "type": "create", "action": "게시판 신규 생성", "who": "영어팀"}]}, {"id": "BRD-002", "level": "초등", "subject": "공통", "grade": "공통", "board": "학교 자율 시간", "name": "안전·건강 교육", "type": null, "count": 95.0, "status": "live", "last_update": "2026-03-20", "history": [{"date": "2026-03-13", "type": "create", "action": "게시판 신규 생성", "who": "공통팀"}, {"date": "2026-03-20", "type": "edit", "action": "평가 계획 자료 보완", "who": "공통팀"}]}, {"id": "BRD-003", "level": "초등", "subject": "국어", "grade": "5학년", "board": "학교 자율 시간", "name": "생각을 키우는 문해력 교실", "type": null, "count": 70.0, "status": "live", "last_update": "2026-03-20", "history": [{"date": "2026-03-13", "type": "create", "action": "게시판 신규 생성", "who": "한문팀"}, {"date": "2026-03-20", "type": "edit", "action": "5학년 차시 자료 보완", "who": "한문팀"}]}, {"id": "BRD-004", "level": "초등", "subject": "국어", "grade": "6학년", "board": "학교 자율 시간", "name": "생각을 넓히는 문해력 교실", "type": null, "count": 70.0, "status": "live", "last_update": "2026-03-20", "history": [{"date": "2026-03-13", "type": "create", "action": "게시판 신규 생성", "who": "한문팀"}, {"date": "2026-03-20", "type": "edit", "action": "6학년 차시 자료 보완", "who": "한문팀"}]}, {"id": "BRD-005", "level": "초등", "subject": "영어", "grade": "공통", "board": "학교 자율 시간", "name": "영어로 표현하기", "type": null, "count": 67.0, "status": "live", "last_update": "2026-03-25", "history": [{"date": "2026-03-25", "type": "create", "action": "게시판 신규 생성", "who": "영어팀"}, {"date": null, "type": "edit", "action": "운영 계획·진도표 수정", "who": "영어팀"}]}, {"id": "BRD-006", "level": "초등", "subject": "영어", "grade": "3학년", "board": "과목 연구실", "name": "수업용 게임 PPT (김혜리)", "type": null, "count": 34.0, "status": "live", "last_update": null, "history": [{"date": null, "type": "create", "action": "게시판 신규 생성", "who": "영어팀"}]}, {"id": "BRD-007", "level": "초등", "subject": "영어", "grade": "3학년", "board": "과목 연구실", "name": "수업용 게임 PPT (최희경)", "type": null, "count": 31.0, "status": "live", "last_update": null, "history": [{"date": null, "type": "create", "action": "게시판 신규 생성", "who": "영어팀(최)"}]}, {"id": "BRD-008", "level": "초등", "subject": "영어", "grade": "3학년", "board": "과목 연구실", "name": "놀이꾸러미 (일일학습지)", "type": null, "count": 20.0, "status": "live", "last_update": "2026-02-24", "history": [{"date": null, "type": "create", "action": "게시판 신규 생성", "who": "영어팀(최)"}, {"date": "2026-02-24", "type": "edit", "action": "3·4학년 1~5/8~10단원 추가", "who": "영어팀(최)"}]}, {"id": "BRD-009", "level": "초등", "subject": "보건", "grade": "5,6학년", "board": "과목 연구실", "name": "보건 수업 영상 레시피", "type": null, "count": 1.0, "status": "live", "last_update": "2026-07-22", "history": [{"date": "2026-07-14", "type": "create", "action": "게시판 신규 생성", "who": "보건팀"}, {"date": "2026-07-22", "type": "edit", "action": "영상 QR 자료 수정", "who": "보건팀"}]}, {"id": "BRD-010", "level": "중학", "subject": "보건", "grade": "1,2,3학년", "board": "특화자료", "name": "영상을 활용한 보건 활동 자료집", "type": null, "count": 1.0, "status": "live", "last_update": "2026-08-16", "history": [{"date": "2026-07-14", "type": "create", "action": "게시판 신규 생성", "who": "보건팀(중학)"}, {"date": "2026-07-22", "type": "edit", "action": "활동 자료집 내용 수정", "who": "보건팀(중학)"}, {"date": "2026-08-16", "type": "delete", "action": "게시판 삭제", "who": "사회팀"}]}];
const META = {"generated_at": "2026-08-18 12:26 (KST)", "source_name": "Y클라우드_게시판 현황_원본데이터 (팀 공유 구글시트)"};

const typeLabel = { create: "신규생성", edit: "수정", delete: "삭제" };
const LEVEL_ORDER = ["초등", "중학", "고등"];

function fmtDate(d){ return d ? d : '<span class="unknown">확인 필요</span>'; }
function fmtCount(c){ return (c === null || c === undefined) ? '<span class="muted">-</span>' : c; }
function statusBadge(s){ return s === 'live' ? '<span class="badge live">게시중</span>' : '<span class="badge prep">준비중</span>'; }
function metaLabel(item){ return item.subject === item.grade ? item.subject : (item.subject + '·' + item.grade); }

document.getElementById('metaLine').innerHTML =
  '<span class="sync-dot"></span>자동 동기화 · 최근 반영 ' + META.generated_at + ' · 원본 수정 후 최대 30분 내 반영';
document.getElementById('footerLine').textContent =
  '원본 데이터: ' + META.source_name + ' · 고등 게시판은 원본에 등록 항목이 없으면 자동으로 생략됩니다.';
document.getElementById('listSummary').textContent =
  '게시판별 콘텐츠 목록 (' + DATA.length + '건) · 클릭하면 변경 이력이 펼쳐져요';

// ---- 과목별 최근 반영 현황 카드 ----
function buildTeamGrid(){
  const groups = new Map();
  DATA.forEach(item => {
    if (item.status !== 'live') return;
    const key = item.level + '|' + item.subject;
    if (!groups.has(key)) groups.set(key, { level: item.level, subject: item.subject, count: 0, dates: [] });
    const g = groups.get(key);
    g.count++;
    if (item.last_update) g.dates.push(item.last_update);
  });
  const arr = [...groups.values()].sort((a, b) => {
    const li = LEVEL_ORDER.indexOf(a.level) - LEVEL_ORDER.indexOf(b.level);
    return li !== 0 ? li : a.subject.localeCompare(b.subject, 'ko');
  });
  document.getElementById('teamGrid').innerHTML = arr.map(g => {
    const latest = g.dates.length ? g.dates.slice().sort().slice(-1)[0] : null;
    return `
      <div class="team-card">
        <div class="name">${g.subject} <small>${g.level}</small></div>
        <div class="row"><span>게시물</span><b>${g.count}건</b></div>
        <div class="row"><span>최근 반영일</span><b>${fmtDate(latest)}</b></div>
      </div>`;
  }).join('');
}

// ---- 학교급 탭 ----
function buildLevelTabs(){
  const counts = {};
  LEVEL_ORDER.forEach(l => counts[l] = DATA.filter(i => i.level === l).length);
  document.getElementById('levelTabs').innerHTML = LEVEL_ORDER.map(l =>
    `<button class="level-tab" data-level="${l}">${l}<span class="cnt">(${counts[l]})</span></button>`
  ).join('');
}

// ---- 게시판별 콘텐츠 목록 (학교급 > 게시판명 그룹) ----
let rowSeq = 0;
function buildGroups(){
  const container = document.getElementById('groupsContainer');
  container.innerHTML = '';

  LEVEL_ORDER.forEach(level => {
    const levelItems = DATA.filter(i => i.level === level);

    if (levelItems.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.dataset.level = level;
      empty.style.display = 'none';
      empty.textContent = `${level} 게시판에 등록된 자료가 아직 없습니다.`;
      container.appendChild(empty);
      return;
    }

    const boardOrder = [];
    levelItems.forEach(i => { if (!boardOrder.includes(i.board)) boardOrder.push(i.board); });

    boardOrder.forEach(board => {
      const groupItems = levelItems.filter(i => i.board === board);

      const groupEl = document.createElement('div');
      groupEl.className = 'group';
      groupEl.dataset.level = level;
      groupEl.style.display = 'none';

      const title = document.createElement('div');
      title.className = 'group-title';
      title.textContent = `${level} · ${board}`;
      groupEl.appendChild(title);

      const table = document.createElement('table');
      table.innerHTML = `<thead><tr><th style="width:16px;"></th><th>과목/학년</th><th>콘텐츠명</th><th class="num">개수</th><th>상태</th><th>최근 업데이트일</th></tr></thead><tbody></tbody>`;
      const tbody = table.querySelector('tbody');

      groupItems.forEach(item => {
        const idx = rowSeq++;

        const row = document.createElement('tr');
        row.className = 'item-row';
        row.dataset.idx = idx;
        row.dataset.level = item.level;
        row.dataset.subject = item.subject;
        row.dataset.grade = item.grade;
        row.innerHTML = `
          <td class="chev">▸</td>
          <td>${metaLabel(item)}</td>
          <td><span class="content-name">${item.name}</span>${item.type ? `<br><span class="muted" style="font-size:13px;">${item.type}</span>` : ''}</td>
          <td class="num">${fmtCount(item.count)}</td>
          <td>${statusBadge(item.status)}</td>
          <td>${fmtDate(item.last_update)}</td>
        `;

        const histRow = document.createElement('tr');
        histRow.className = 'hist-row';
        histRow.id = 'hist-' + idx;
        histRow.innerHTML = `
          <td colspan="6">
            <ul class="timeline">
              ${[...item.history].reverse().map(h => `
                <li>
                  <div class="t-date">${fmtDate(h.date)}</div>
                  <div class="t-head">
                    <span class="etype ${h.type}">${typeLabel[h.type] || h.type}</span>
                    <span class="t-action">${h.action}</span>
                  </div>
                  <div class="t-who">작성자: ${h.who}</div>
                </li>`).join('')}
            </ul>
          </td>
        `;

        row.addEventListener('click', () => {
          const opening = !histRow.classList.contains('open');
          row.classList.toggle('open', opening);
          histRow.classList.toggle('open', opening);
        });

        tbody.appendChild(row);
        tbody.appendChild(histRow);
      });

      groupEl.appendChild(table);
      container.appendChild(groupEl);
    });
  });
}

buildTeamGrid();
buildLevelTabs();
buildGroups();

// ---- 과목/학년 필터 옵션 자동 생성 ----
const subjectFilterEl = document.getElementById('subjectFilter');
const gradeFilterEl = document.getElementById('gradeFilter');

function fillSelect(selectEl, values){
  selectEl.innerHTML = '<option value="all">전체</option>' +
    values.map(v => `<option value="${v}">${v}</option>`).join('');
}

const allSubjects = [...new Set(DATA.map(i => i.subject))].sort((a, b) => a.localeCompare(b, 'ko'));
fillSelect(subjectFilterEl, allSubjects);
updateGradeOptions('all');

function updateGradeOptions(subject){
  const pool = subject === 'all' ? DATA : DATA.filter(i => i.subject === subject);
  const grades = [...new Set(pool.map(i => i.grade))];
  fillSelect(gradeFilterEl, grades);
}

// ---- 학교급 탭 + 과목/학년 필터 통합 적용 ----
const levelTabs = document.querySelectorAll('.level-tab');
const levelSections = document.querySelectorAll('.group[data-level], .empty-state[data-level]');
let currentLevel = '초등';

function applyFilters(){
  const subject = subjectFilterEl.value;
  const grade = gradeFilterEl.value;

  levelSections.forEach(s => {
    s.style.display = (s.dataset.level === currentLevel) ? '' : 'none';
  });

  document.querySelectorAll('.group[data-level="' + currentLevel + '"]').forEach(groupEl => {
    const tbody = groupEl.querySelector('tbody');
    let visibleCount = 0;

    tbody.querySelectorAll('tr.item-row').forEach(row => {
      const matchSubject = (subject === 'all' || row.dataset.subject === subject);
      const matchGrade = (grade === 'all' || row.dataset.grade === grade);
      const match = matchSubject && matchGrade;
      const histRow = document.getElementById('hist-' + row.dataset.idx);
      row.style.display = match ? '' : 'none';
      if (!match){
        row.classList.remove('open');
        histRow.classList.remove('open');
        histRow.style.display = 'none';
      } else {
        visibleCount++;
      }
    });

    let noMatchEl = groupEl.querySelector('.no-match');
    if (visibleCount === 0){
      groupEl.style.display = (groupEl.dataset.level === currentLevel) ? '' : 'none';
      if (!noMatchEl){
        noMatchEl = document.createElement('div');
        noMatchEl.className = 'no-match';
        noMatchEl.textContent = '선택한 조건에 해당하는 자료가 없습니다.';
        groupEl.appendChild(noMatchEl);
      }
      noMatchEl.style.display = '';
      groupEl.querySelector('table').style.display = 'none';
    } else {
      if (noMatchEl) noMatchEl.style.display = 'none';
      groupEl.querySelector('table').style.display = '';
    }
  });
}

levelTabs.forEach(tab => {
  tab.addEventListener('click', () => {
    currentLevel = tab.dataset.level;
    levelTabs.forEach(t => t.classList.toggle('active', t === tab));
    applyFilters();
  });
});

subjectFilterEl.addEventListener('change', () => {
  updateGradeOptions(subjectFilterEl.value);
  applyFilters();
});
gradeFilterEl.addEventListener('change', applyFilters);

levelTabs.forEach(t => t.classList.toggle('active', t.dataset.level === currentLevel));
applyFilters();
</script>
</body>
</html>
