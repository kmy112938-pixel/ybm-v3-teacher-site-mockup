<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>업데이트 관리</title>
<style>
/* 색: 파랑 = 지금 할 작업, 빨강 = 오류·예외. 나머지는 회색 계열 */
:root {
  --blue: #2563eb; --blue-d: #1d4ed8; --blue-l: #eff4ff;
  --ink: #111827; --ink2: #374151; --mute: #6b7280; --line: #e5e7eb; --bg: #f7f8fa;
  --red: #dc2626; --red-l: #fef2f2;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { font-family: Pretendard, -apple-system, 'Malgun Gothic', sans-serif; color: var(--ink); background: var(--bg); font-size: 15px; line-height: 1.5; display: flex; flex-direction: column; overflow: hidden; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
code { font: 13px Consolas, monospace; color: var(--ink2); background: #f1f3f6; border-radius: 5px; padding: 2px 6px; word-break: break-all; }
.mute, .sub { color: var(--mute); }
.ex { color: var(--red); font-weight: 600; }
.na { color: #c3c8d0; }
.w { color: var(--mute); font-size: 16px; white-space: nowrap; }

/* 상단 */
.hd { height: 64px; flex: none; background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 16px; padding: 0 24px 0 20px; }
.logo { width: 220px; flex: none; display: flex; align-items: center; gap: 10px; white-space: nowrap; font-size: 16.5px; }
.logo i { width: 32px; height: 32px; border-radius: 8px; background: #374151; color: #fff; font-style: normal; font-weight: 800; display: grid; place-items: center; }
.search { flex: 1; max-width: 420px; position: relative; }
.search input { width: 100%; height: 42px; border-radius: 21px; border: 1px solid transparent; background: #eef1f6; padding: 0 16px 0 42px; font-size: 15px; outline: none; }
.search input:focus { background: #fff; border-color: var(--blue); }
.search svg { position: absolute; left: 16px; top: 13px; }
.sres { position: absolute; top: 48px; left: 0; right: 0; min-width: 380px; max-height: min(440px, calc(100vh - 120px)); overflow-y: auto; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px #0000001a; padding: 6px; z-index: 30; }
.sres a { display: flex; align-items: baseline; gap: 10px; padding: 9px 12px; border-radius: 8px; flex-wrap: wrap; }
.sres a:hover { background: #f3f5f8; }
.sres-total { padding: 5px 12px; font-size: 15px; color: var(--mute); }
.sres a span { font-size: 16px; color: var(--ink2); }
.orgsel { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; color: var(--ink2); white-space: nowrap; }
.orgsel select { height: 42px; min-width: 150px; border: 1px solid #cfd4dc; border-radius: 10px; padding: 0 10px; font-size: 15px; font-weight: 700; color: var(--ink); background: #fff; }
.btn-primary { height: 42px; padding: 0 18px; border-radius: 10px; background: var(--blue); color: #fff; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; white-space: nowrap; }
.btn-primary:hover { background: var(--blue-d); }
.btn-primary:disabled { background: #a8b8d8; cursor: not-allowed; }
.btn-ghost { height: 40px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line); background: #fff; font-weight: 600; white-space: nowrap; display: inline-flex; align-items: center; }
.btn-ghost:hover { background: #f6f7f9; }
.btn-sub { height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid #cfd4dc; background: #fff; color: var(--ink2); font-weight: 600; font-size: 16px; display: inline-flex; align-items: center; white-space: nowrap; }
.btn-sub:hover { border-color: var(--blue); color: var(--blue-d); }
.btn-act { height: 38px; min-width: 96px; padding: 0 14px; border-radius: 9px; background: var(--blue); color: #fff; font-weight: 700; font-size: 16.5px; white-space: nowrap; }
.btn-act:hover { background: var(--blue-d); }
.btn-act.off { background: #fff; color: var(--mute); border: 1px solid var(--line); }
/* 완료 처리 버튼: 클릭 전에는 체크 아이콘을 함께 표시. 입력용 버튼은 제외 */
.btn-act.task-complete { display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
.btn-act.task-complete .task-check { font-size: 17px; font-weight: 800; line-height: 1; }
/* 완료 직후: 누른 버튼 자리에는 완료 상태(비활성)로 표시 */
.clist.task-cards .row.sr.jtask.task-done { background: #f8faff; border-color: #d6e2ff; }
.jt-finished { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 38px; min-width: 96px; padding: 0 12px; border-radius: 9px; background: var(--blue-l); color: var(--blue-d); font-size: 16.5px; font-weight: 700; white-space: nowrap; }
.jt-finished .task-check { font-size: 17px; font-weight: 800; line-height: 1; }
/* 누른 뒤 완료 상태: 원래 표시를 유지하고 체크만 추가 */
.stage-done .done-check { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--blue); color: #fff; font-size: 16px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; }
.lnk { color: var(--blue-d); font-weight: 600; font-size: 16px; }
.me { width: 40px; height: 40px; border-radius: 50%; background: #374151; color: #fff; font-size: 15px; font-weight: 700; flex: none; }

.wrap { flex: 1; min-height: 0; display: flex; }

/* 왼쪽 메뉴 */

.nav { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border-radius: 9px; font-size: 15.5px; font-weight: 600; color: var(--ink2); }
.nav:hover { background: #eef1f6; }
.nav.on { background: #e8ebf0; color: var(--ink); }
.nav span:first-child { flex: 1; }
.nav .c { font-size: 15px; font-weight: 700; color: var(--mute); }

/* 본문 */
main { flex: 1; min-width: 0; overflow-y: auto; padding: 22px 32px 56px; }
.ph { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; }
.ph.col { flex-direction: column; align-items: flex-start; gap: 6px; margin-bottom: 18px; }
.ph h1 { font-size: 23px; letter-spacing: -.3px; display: flex; align-items: center; gap: 10px; }
.n { font-size: 16px; color: var(--mute); font-weight: 600; }
.h2 { font-size: 17px; margin: 26px 0 10px; display: flex; align-items: center; gap: 8px; }
.crumb { font-size: 16px; color: var(--mute); margin-bottom: 4px; display: flex; gap: 6px; }
.crumb a:hover { color: var(--blue-d); text-decoration: underline; }
.crumb .gt { color: #c0c5cd; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px; font-size: 16.5px; color: var(--ink2); }
.meta input[type=date] { height: 32px; border: 1px solid var(--line); border-radius: 7px; padding: 0 8px; font-size: 16px; }
.st { font-size: 16px; font-weight: 700; color: var(--ink2); background: #eef1f6; border-radius: 7px; padding: 3px 10px; }
.st.ex { background: var(--red-l); color: var(--red); }

.filters { margin-left: auto; display: flex; gap: 6px; }
.box { background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }

.none { padding: 18px 20px; color: var(--mute); }
.more { display: block; padding: 12px 20px; font-weight: 600; color: var(--blue-d); border-top: 1px solid #f0f1f3; }
.inp { width: 100%; height: 42px; border: 1px solid #d1d5db; border-radius: 9px; padding: 0 12px; outline: none; font-size: 15px; background: #fff; }
.inp:focus { border-color: var(--blue); }
.inp.ta { height: auto; padding: 10px 12px; resize: vertical; }
.inp.sm { width: auto; height: 38px; font-size: 16px; }
.og { display: inline-block; font-size: 15px; font-weight: 600; color: var(--ink2); border: 1px solid #d9dde3; border-radius: 6px; padding: 1px 8px; margin-right: 8px; white-space: nowrap; background: #fff; }

/* 업무 목록: 교과서 · 해야 할 일 · 예외 · 버튼 */
.row { display: grid; grid-template-columns: minmax(130px, 1fr) minmax(200px, 1.6fr) minmax(0, 1.6fr) auto; gap: 16px; align-items: center; padding: 13px 20px; border-bottom: 1px solid #f0f1f3; border-left: 3px solid transparent; }
.row.nt { grid-template-columns: minmax(220px, 1.6fr) minmax(0, 1.6fr) auto; }
.list > .row:last-child { border-bottom: 0; }
.row.issue { border-left-color: var(--red); }
.row.open { background: #f8faff; }
.c-tb { font-weight: 700; }
.c-tb a:hover { color: var(--blue-d); text-decoration: underline; }
.c-do { font-weight: 600; }

.c-act { display: flex; justify-content: flex-end; }
.panel { padding: 16px 20px 18px 23px; background: #f8faff; border-bottom: 1px solid var(--line); border-left: 3px solid var(--blue); }

/* 처리 화면 */
.foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.foot.left { justify-content: flex-start; }
.rv { padding: 2px 0 14px; margin-bottom: 10px; border-bottom: 1px dashed var(--line); display: grid; gap: 8px; }
.seg2 { display: inline-flex; border: 1px solid #d1d5db; border-radius: 9px; overflow: hidden; width: fit-content; }
.seg2 label { cursor: pointer; } .seg2 input { display: none; }
.seg2 span { display: inline-block; padding: 8px 20px; background: #fff; font-weight: 600; }
.seg2 label + label span { border-left: 1px solid #d1d5db; }
.seg2 input:checked + span { background: var(--blue); color: #fff; }
.seg2 input[value=fix]:checked + span { background: var(--red); }
.fixbox { display: grid; gap: 8px; }

.cks { display: grid; gap: 10px; }
.ck { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; }
.ckh { font-weight: 700; }
.cmp { display: flex; align-items: center; gap: 18px; }
.cmp div { display: flex; flex-direction: column; } .cmp span { color: var(--mute); font-size: 15.5px; } .cmp b { font-size: 17px; }
.cmp .arrow { color: var(--mute); } .cmp .down { color: var(--red); font-weight: 700; font-size: 16px; }
.checks { display: flex; flex-direction: column; gap: 7px; }
.checks label { display: flex; gap: 10px; align-items: center; cursor: pointer; }
.checks input { width: 17px; height: 17px; }
.ver { display: inline-block; font-size: 14.5px; font-weight: 700; color: var(--mute); background: #f1f3f6; border-radius: 5px; padding: 1px 7px; margin-right: 4px; }
.inline { display: flex; gap: 8px; align-items: center; }
.inline .inp { flex: 1; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 10px 18px; align-items: center; margin-bottom: 10px; }
.kv > span:nth-child(odd) { color: var(--mute); }
.row3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; margin-top: 10px; }
.path { font-size: 16px; color: var(--ink2); word-break: break-all; }
.gate { list-style: none; display: grid; gap: 6px; margin-bottom: 10px; }
.gate li { display: flex; gap: 8px; align-items: flex-start; }
.gate .mk { width: 20px; height: 20px; border-radius: 50%; background: var(--red-l); color: var(--red); display: grid; place-items: center; font-size: 14px; font-weight: 800; flex: none; }
.gate em { display: block; font-style: normal; font-size: 15.5px; color: var(--red); }

/* 현황 표 */
.th, .tr { display: grid; grid-template-columns: minmax(130px, 1.2fr) 1fr 1fr 1fr minmax(120px, 1fr) 90px; gap: 14px; align-items: center; padding: 0 20px; }

.th { height: 40px; font-size: 15.5px; color: var(--mute); background: #fafbfc; border-bottom: 1px solid var(--line); }
.tr { min-height: 50px; border-bottom: 1px solid #f0f1f3; font-size: 16.5px; }
.tr:last-child { border-bottom: 0; }
.tr:hover { background: #f8faff; }

/* 상세 */
.exline { background: var(--red-l); color: var(--red); font-weight: 600; border-radius: 9px; padding: 9px 14px; margin-bottom: 8px; }
.exline.in { border-radius: 0; margin: 0; border-top: 1px solid #fecaca; }

 

.memo { padding: 4px 20px 14px; }
.mm { display: flex; align-items: baseline; gap: 8px; padding: 10px 0; border-bottom: 1px solid #f0f1f3; flex-wrap: wrap; }
.mm .mt { flex: 1; min-width: 0; }
.mf { display: flex; gap: 8px; margin-top: 10px; }
.mf .memo-org { flex: none; width: 165px; }
.mf #memoInp { flex: 1; min-width: 0; }
.more-d { margin-top: 22px; }
.more-d > summary { font-size: 16px; font-weight: 700; color: var(--ink2); cursor: pointer; margin-bottom: 10px; }

.sub-h { font-size: 16px; font-weight: 700; color: var(--mute); margin: 12px 0 6px; }
.sub-h:first-child { margin-top: 0; }
.flow { list-style: none; display: grid; gap: 2px; }
.flow li { display: flex; align-items: center; gap: 4px; padding: 6px 4px; font-size: 16.5px; color: #a3aab6; flex-wrap: wrap; }
.flow li.d { color: var(--ink2); }
.flow li.c { color: var(--blue-d); font-weight: 700; background: var(--blue-l); border-radius: 8px; padding: 7px 8px; }
.flow li.x { color: var(--red); font-weight: 600; }
.flow .mk { width: 20px; text-align: center; }
.flow .w { margin-left: auto; }
.flow .w.b { color: var(--blue-d); font-weight: 700; }
.lr { display: flex; align-items: center; gap: 10px; padding: 7px 0; flex-wrap: wrap; font-size: 16.5px; }
.lr .k { min-width: 80px; color: var(--mute); font-weight: 600; }

/* 등록 */
.form { max-width: 760px; }
.f { margin-bottom: 18px; }
.f > label, .f.two label { display: block; font-size: 16.5px; font-weight: 700; margin-bottom: 7px; }

.results { display: flex; flex-direction: column; margin-top: 6px; }
.results button { display: flex; gap: 10px; align-items: baseline; text-align: left; padding: 9px 12px; border-radius: 8px; }
.results button span { color: var(--mute); font-size: 16px; }
.results button:hover { background: #f3f5f8; }

.targets { display: flex; gap: 8px; }
.targets label { display: flex; gap: 8px; align-items: center; border: 1px solid #d1d5db; border-radius: 9px; padding: 8px 16px; cursor: pointer; background: #fff; font-weight: 600; }
.targets input { width: 17px; height: 17px; }
.targets label.locked { background: #f1f3f6; color: var(--mute); cursor: not-allowed; }
.hint { margin-top: 8px; font-size: 16px; color: var(--ink2); }
.rowf { display: flex; gap: 8px; flex-wrap: wrap; }
.rowf .inp { width: auto; min-width: 150px; }

/* 처리자 창 */
.dim { position: fixed; inset: 0; background: #0f172a66; display: flex; align-items: center; justify-content: center; z-index: 40; }
.modal { width: 360px; background: #fff; border-radius: 14px; box-shadow: 0 20px 60px #00000033; padding: 22px; display: grid; gap: 8px; }
.modal h2 { font-size: 18px; margin-bottom: 6px; }

.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px); background: #111827; color: #fff; padding: 12px 20px; border-radius: 22px; font-size: 16.5px; opacity: 0; transition: .25s; z-index: 50; pointer-events: none; max-width: 90vw; }
.toast.on { opacity: 1; transform: translateX(-50%); }
.toast.bad { background: var(--red); }

@media (max-width: 1100px) {
   .logo { width: 180px; }
  .row { grid-template-columns: minmax(110px, 1fr) minmax(160px, 1.4fr) auto; } 
  .th, .tr { grid-template-columns: minmax(110px, 1.2fr) 1fr 1fr 1fr 80px; } .th span:nth-child(5), .tr span:nth-child(5) { display: none; }
  
}
@media (max-width: 760px) {
  body { overflow: auto; } .wrap { flex-direction: column; } .hd { flex-wrap: wrap; height: auto; padding: 10px 16px; }
  
  .views { display: flex; } 
  main { padding: 16px; } .row, .row.nt { grid-template-columns: 1fr; }
  .th { display: none; } .tr, .cr, .fr { grid-template-columns: 1fr; gap: 4px; padding: 10px 16px; }
  .row3, .newtb, .f.two { grid-template-columns: 1fr; }
}

/* 2차 보완 */

.ckt { font-weight: 700; }
.ckd { font-size: 16.5px; color: var(--ink2); background: #fafbfc; border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; }
.pick { max-width: 760px; }
.pick h1 { font-size: 23px; margin-bottom: 16px; }
.pick-g { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pick-b { display: flex; justify-content: space-between; align-items: center; height: 64px; padding: 0 20px; background: #fff; border: 1px solid var(--line); border-radius: 12px; font-size: 17px; font-weight: 700; }
.pick-b:hover { border-color: var(--blue); }
.pick-b span { font-size: 16px; font-weight: 600; color: var(--mute); }
.pad1 { padding: 10px 20px; border-bottom: 1px solid #f0f1f3; }
.pick-h { font-size: 16px; font-weight: 700; color: var(--mute); margin: 16px 0 8px; }
.pick-g.sm { grid-template-columns: repeat(4, 1fr); }
.pick-g.sm .pick-b { height: 52px; font-size: 15.5px; }
.pick-b.z { color: var(--mute); }
.pick { max-width: 900px; }

/* 상세 2열 */
main { padding: 18px 28px 48px; }
.ph.col { margin-bottom: 12px; }
.dgrid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.dcol { display: grid; gap: 14px; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
.card > h3 { font-size: 15.5px; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
.clist .row, .clist .row.nt { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto; padding: 10px 0; border-left: 0; gap: 10px; }
.clist .row:last-child { border-bottom: 0; }
.clist .panel { margin: 0 -16px; padding: 14px 16px; border-left: 3px solid var(--blue); }
.none0 { padding: 8px 0; color: var(--mute); }

.fg { padding: 9px 0; border-bottom: 1px solid #f0f1f3; }
.fg:last-child { border-bottom: 0; }
.fgh { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-weight: 700; margin-bottom: 6px; }
.rvr { font-weight: 500; font-size: 15.5px; color: var(--mute); }
.rvr.ex { color: var(--red); font-weight: 600; }
.fl2s { display: flex; flex-wrap: wrap; gap: 6px; }
.fl2 { display: inline-flex; gap: 6px; align-items: baseline; font-size: 15.5px; border: 1px solid var(--line); border-radius: 7px; padding: 4px 10px; color: var(--ink); }
.fl2 span { color: var(--mute); }
a.fl2:hover { border-color: var(--blue); color: var(--blue-d); }
/* 파일 칸 상태: 이번 회차 준비됨(파랑 ✓) · 이전 회차(회색) · 없음(점선) · 문제(빨강) */
.fl2 i { font-style: normal; font-weight: 800; color: var(--blue); }
.fl2 small { font-size: 13.5px; color: var(--mute); }
.fl2.x small { color: var(--red); opacity: .8; }
.fl2.old small { color: #b0b6c0; }
.fl2.ok { border: 1.5px solid var(--blue); }
.fl2.old { background: #f3f4f6; color: #9ca3af; border-color: #e5e7eb; }
.fl2.old span { color: #b0b6c0; }
.fl2.none { border: 1.5px dashed #cfd4dc; color: #9ca3af; background: transparent; }
.fl2.none em { font-style: normal; font-size: 14.5px; }
.fl2.x { border: 1.5px solid var(--red); color: var(--red); }
.fl2.x span { color: var(--red); opacity: .8; }
.card .mm { padding: 8px 0; }
.card .mf { margin-top: 8px; }
.more-d { margin-top: 14px; }
.more-d > summary { font-size: 15px; margin-bottom: 8px; }
@media (max-width: 1100px) { .dgrid { grid-template-columns: 1fr; }  }

/* 콘텐츠 현황 블록 */

.clist .row, .clist .row.nt { grid-template-columns: minmax(0, 1fr) auto; row-gap: 3px; }
.clist .c-do { grid-column: 1; grid-row: 1; }

.clist .c-act { grid-column: 2; grid-row: 1 / span 2; }

/* 전체 2열 */
.g2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(300px, 1fr); gap: 14px; align-items: start; }

.g2 .list .row { grid-template-columns: minmax(110px, 0.9fr) minmax(0, 1.4fr) minmax(0, 1.2fr) auto; gap: 12px; padding: 11px 16px; }
.card h3 .hm { margin-left: auto; font-size: 15.5px; font-weight: 600; color: var(--blue-d); }

.g2 .form { max-width: none; }
.card .lr.pad1, .card .pad1 { padding: 8px 0; }
.card .kv { margin-top: 6px; }
@media (max-width: 1100px) { .g2, .g2.eq, .jgrid { grid-template-columns: 1fr; } }

/* 흐름표 */
.fts { display: grid; grid-template-columns: repeat(auto-fill, minmax(520px, 1fr)); gap: 12px; margin-bottom: 14px; }
.ft { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px 12px; }
.fth { font-weight: 700; font-size: 15px; margin-bottom: 6px; }

/* 교과서 현재 적용 정보 · 이번 수정 대상 · 처리 직후 안내 */

.ibar.ed { display: grid; grid-template-columns: minmax(78px, .75fr) minmax(90px, .85fr) minmax(126px, 1.25fr) minmax(44px, .4fr) minmax(126px, 1.2fr) minmax(140px, 1.3fr) minmax(135px, 1.15fr) minmax(78px, .8fr) auto; align-items: end; gap: 4px 8px; }

// 검수에서 '수정 필요'로 남긴 요청이면 누가·언제 남겼는지(화면에 기록임을 표시)

}

// ───────── 수정 대상 규칙 ─────────
function normalizeTargets(sel = {}) {

}
function requiredSlots(db, job) {

// 파일 정보 조회가 실패 중인 전자저작물 칸(파일은 있을 수 있으므로 누락으로 판정하지 않음)

// ───────── 회차 ─────────

// ───────── 파일 등록 (자동 감지·수동 연결 공통) ─────────
function registerFile(db, ctx, job, content, slot, item, source = 'auto') {

    return null; // 자동 감지 시 무시 · 등록·회차 진행 없음
  }
  // 서버 반영·검수가 진행된 회차에서 실제 파일이 바뀌면 새 회차(재반영·재검수)
  if (roundHasProgress(job, content)) startRound(db, ctx, job, content, '파일 변경');
  const prev = curFiles(db, job, content).find((f) => f.slot === slot);
  const f = {
    id: nextId(db, 'f'), jobId: job.id, content, slot, round: job.rounds[content],
    driveId: item.driveId, path: item.path, name: item.name, size: item.size ?? null,
    modifiedAt: item.modifiedAt || null, versionKey: item.versionKey || null,

    else f.baseEbookRev = job.ebookRev || null;
  }
  if (prev) prev.supersededBy = f.id;

    jobId: job.id, content, round: f.round,
    text: `${slotLabel(content, slot)} ${prev ? '변경 등록' : '등록'} · ${f.name}`,
    data: { fileId: f.id, path: f.path, size: f.size, source },

}

// 이북 새 파일이 등록되면(한 번의 조회 묶음당 1회) 이북 차수를 올리고, 진행 중이던 연계 콘텐츠를 재작업으로 돌림
function ebookUpdated(db, ctx, job) {
  job.ebookRev = (job.ebookRev || 0) + 1;
  log(db, ctx, 'ebook_rev', { jobId: job.id, content: 'ebook', text: `이북 수정본 ${job.ebookRev} 등록` });
  if (job.ebookRev > 1) {
    for (const c of ['digital', 'connecting']) {
      if (job.targets[c] && (roundHasFiles(db, job, c) || roundHasProgress(job, c))) startRound(db, ctx, job, c, '이북 재수정', `이북 수정본 ${job.ebookRev} 기준으로 다시 반영`);
    }

}

// ───────── 유효성 판정 ─────────
function stagingValid(db, job, c) {
  const r = job.rounds[c], p = fp(db, job, c);
  return job.staging.some((s) => !s.cancelled && s.content === c && s.round === r && s.fp === p);
}
function reviewOf(db, job, c) {
  const r = job.rounds[c];
  const rv = [...job.reviews].reverse().find((x) => x.content === c && x.round === r);
  return rv ? { ...rv, valid: rv.fp === fp(db, job, c) } : null;
}
const reviewOk = (db, job, c) => { const r = reviewOf(db, job, c); return !!(r && r.valid && r.result === 'ok'); };
const live = (a) => (a || []).filter((x) => !x.cancelled);
const deliveryValid = (job) => { const d = last(live(job.deliveries)); return !!d && d.ebookRev === job.ebookRev; };

function versionHistory(db, job) {
  return [...(tbOf(db, job).versions || [])].sort((a, b) => vnum(a.version) - vnum(b.version));
}
function sizeCheck(db, job) {
  if (job.kind !== '수정' || !job.targets.digital) return { state: 'na' };
  const uz = curFiles(db, job, 'digital').find((f) => f.slot === 'update_zip');
  if (!uz) return { state: 'nofile' };
  const prev = last(versionHistory(db, job).filter((v) => vnum(v.version) < vnum(job.version) && v.zipSize != null));
  if (!prev) return { state: 'noprev', file: uz };
  if (uz.size == null) return { state: 'unknown', file: uz, prev };
  if (uz.size >= prev.zipSize) return { state: 'ok', file: uz, prev, diff: uz.size - prev.zipSize };
  const diff = prev.zipSize - uz.size;
  const pct = Math.round((diff / prev.zipSize) * 1000) / 10;
  const ack = [...job.sizeAcks].reverse().find((a) => a.fileId === uz.id) || null;

}
function cumulativeItems(db, job) {

  return { inherited, added: (job.newItems || []).map((t) => ({ version: job.version, text: t })) };
}
function cumulativeCheck(db, job) {

  const uz = curFiles(db, job, 'digital').find((f) => f.slot === 'update_zip');
  if (!uz) return { state: 'nofile' };

}
const jsonNeeded = (db, job) => job.kind === '수정' && job.targets.digital && tbOf(db, job).approval === '인정';
const jsonEntry = (db, job) => db.commonJson.entries.find((e) => e.jobId === job.id && e.version === job.version) || null;
function jsonState(db, job) {

function finalizeGate(db, job) {

  for (const c of CONTENTS) if (t[c]) items.push({ key: 'review_' + c, label: `${CONTENT_LABEL[c]} 검수 완료`, ok: reviewOk(db, job, c) });
  if (t.ebook) {
    const mm = [...baseMismatch(db, job, 'digital'), ...baseMismatch(db, job, 'connecting')];
    const conn = curFiles(db, job, 'connecting').length === 0;
    items.push({
      key: 'base', label: `기준 이북 일치 (최신 수정본 ${job.ebookRev || 0})`, ok: mm.length === 0 && !conn && (job.ebookRev || 0) > 0,
      fix: mm.length ? `${uniq(mm.map((f) => CONTENT_LABEL[f.content])).join('·')}이(가) 이전 이북 기준입니다. 최신 이북으로 다시 반영하세요` : '',

// ───────── 업무 도출 ─────────
function derive(db, job, now) {
  const tb = tbOf(db, job), t = job.targets;
  const tasks = [], issues = [], contents = {};

      overdue, issue: false, wait: false, ...o, orgs,
    });
  };
  const path = (c, s) => contentPath(db, job, c, s);
  const gate = finalizeGate(db, job);

  if (job.closedAt) {
    for (const c of CONTENTS) if (t[c]) contents[c] = { status: '완료', step: '운영 반영 완료', round: job.rounds[c] };
    return pack();
  }
  const hasEb = t.ebook && curFiles(db, job, 'ebook').length > 0;

  // 이북
  if (t.ebook) {
    const r = job.rounds.ebook, ri = roundInfo(job, 'ebook'), fix = r > 1;
    if (!roundHasFiles(db, job, 'ebook')) {
      contents.ebook = { status: fix ? '수정 필요' : '진행 중', step: '블루가 이북 수정' };
      add({ kind: 'ebook_upload', org: '블루가 이북', content: 'ebook', round: r, wait: true, label: fix ? '이북 다시 고쳐서 OneDrive에 올리기' : '수정한 이북 OneDrive에 올리기', req: reqOf(ri, fix && ri?.note ? `수정 요청: ${ri.note}` : ''), reason: fix && ri?.note ? `수정 요청: ${ri.note}` : '', path: path('ebook') });
    } else if (reviewOk(db, job, 'ebook')) contents.ebook = { status: '완료', step: '검수 완료' };
    else contents.ebook = { status: '진행 중', step: '전자저작물 반영 후 함께 검수' };
  }

  // 전자저작물

    const allMiss = missingSlots(db, job), pend = metaPendingSlots(db, job), mm = baseMismatch(db, job, 'digital');

    const any = curFiles(db, job, 'digital').length > 0;
    const set = (status, step) => (contents.digital = { status, step });

    else if (t.ebook && !deliveryValid(job)) {
      const re = live(job.deliveries).length > 0; // 되돌린 전달은 빼고 판단

      add({ kind: 'deliver', org: '편집팀', content: 'digital', round: job.ebookRev, label: re ? '새 수정 이북 업체에 다시 보내기' : '수정 이북 업체에 보내기', button: '전달 완료', issue: false, reason: re ? `이북 수정본 ${job.ebookRev} 등록` : '', path: path('ebook') });
    } else if (allMiss.length || mm.length || !roundHasFiles(db, job, 'digital')) {

      add({ kind: 'register', org: '편집팀', content: 'digital', round: r, wait: true, issue: partial || baseBad, label: fix || mm.length ? '업체 수정본 받아서 OneDrive에 올리기' : '업체 결과물 받아서 OneDrive에 올리기', reason, req: reqOf(ri, reason), path: path('digital'), missing: miss });

        const list = [needEb && 'ebook', needDg && 'digital'].filter(Boolean);
        set(needDg ? '검수 필요' : '완료', needDg ? '편집팀 검수' : '검수 완료');
        if (needEb) contents.ebook = { status: '검수 필요', step: '전자저작물과 함께 검수' };
        add({ kind: 'review', org: '편집팀', content: 'digital', round: r, label: list.map((c) => CONTENT_LABEL[c]).join('·') + ' 검수하기', button: '검수', reviewContents: list });

    } else set('완료', '검수 완료');
  }

  // 최종 확정 → 운영 반영 → 운영 확인
  const allRev = CONTENTS.filter((c) => t[c]).every((c) => reviewOk(db, job, c));
  const fv = finalizeValid(db, job), pv = prodValid(db, job);
  if (job.finalizations.length && !fv) issues.push({ kind: 'refinalize', text: '확정 후 파일이 바뀌어 다시 검수·확정해야 합니다', action: '변경된 콘텐츠를 다시 검수한 뒤 재확정하세요' });
  if (allRev) {
    if (!fv) {
      const bad = gate.items.filter((i) => !i.ok);
      add({ kind: 'finalize', org: '편집팀', round: job.finalizations.length + 1, label: '최종 확정하기', button: '최종 확정', issue: bad.length > 0, blocked: bad.length > 0, reason: bad.length ? '확정 불가: ' + bad.map((i) => i.label).join(', ') : '' });
    } else if (!pv) add({ kind: 'prod', org: '스퀘어네트', round: job.finalizations.length, label: '운영 서버에 반영하기', button: '반영 완료' });
    else add({ kind: 'prod_confirm', org: '편집팀', round: job.prods.length, label: '운영 서버 반영 결과 확인', button: '확인 완료' });
  }
  if (!job.assignees['편집팀']) add({ kind: 'assign', orgs: ['AI랩'], issue: true, label: '편집팀 담당자 정하기', button: '지정', reason: '담당자 없음' });

  // 이 작업 폴더의 메타데이터 조회 실패
  const folder = jobFolder(db, job) + '/';
  for (const m of db.metaFailures) if (!m.resolvedAt && m.path.startsWith(folder)) {
    add({ kind: 'meta', orgs: ['AI랩'], round: m.id, issue: true, label: '파일 정보 다시 읽기', button: '다시 읽기', reason: `파일 정보를 못 읽음 · ${m.name}`, failureId: m.id });
  }
  return pack();

  function pack() {
    for (const x of tasks) x.priority = x.issue ? 1 : x.overdue ? 2 : x.wait ? 4 : 3;
    tasks.sort((a, b) => a.priority - b.priority);
    const lead = tasks.find((x) => !x.wait) || tasks[0];
    return {
      job, tb, contents, tasks, issues, gate, overdue,
      done: !!job.closedAt, finalized: !!job.closedAt || finalizeValid(db, job), prodDone: !!job.closedAt || prodValid(db, job),
      stage: job.closedAt ? '완료' : lead ? lead.label : '대기',
      orgs: uniq(tasks.flatMap((x) => x.orgs)),
      attention: tasks.some((x) => x.issue) || issues.length > 0,
    };
  }
}

// 작업과 연결되지 않은 파일(식별 실패 등)도 담당 업무로 노출
function globalTasks(db) {
  const tasks = [];
  for (const u of db.unmatched) if (!u.resolved) {
    const orgs = ['AI랩'];
    tasks.push({ id: `U:${u.id}`, kind: 'unmatched', orgs, jobId: u.jobId || null, textbook: u.textbookTitle || '교과서 모름', label: '파일을 맞는 작업에 연결', button: '연결', reason: `${u.reason} · ${u.name}`, issue: true, priority: 1, unmatchedId: u.id });
  }
  for (const m of db.metaFailures) if (!m.resolvedAt && !m.jobId) {
    tasks.push({ id: `M:${m.id}`, kind: 'meta', orgs: ['AI랩'], textbook: '교과서 모름', label: '파일 정보 다시 읽기', button: '다시 읽기', reason: `파일 정보를 못 읽음 · ${m.name}`, issue: true, priority: 1, failureId: m.id });
  }
  return tasks;
}

function allTasks(db, now) {
  const derived = db.jobs.map((j) => derive(db, j, now));
  const tasks = [...globalTasks(db), ...derived.flatMap((d) => d.tasks)];
  tasks.sort((a, b) => a.priority - b.priority);
  return { derived, tasks };
}

// ───────── 금주 진행사항 ─────────
const RECENT_TYPES = new Set(['job_created', 'file_registered', 'file_linked', 'delivered', 'staged', 'reviewed', 'json_added', 'json_deployed', 'finalized', 'prod_done', 'prod_confirmed', 'size_ack', 'cumul_checked']);
function weekly(db, now, tasks) {
  const from = weekStartKst(now);
  const evs = db.events.filter((e) => e.at >= from && e.at <= now);
  const distinct = (type) => new Set(evs.filter((e) => e.type === type).map((e) => `${e.jobId}|${e.content}|${e.round}`)).size;
  const recent = db.events.filter((e) => RECENT_TYPES.has(e.type)).slice(-10).reverse().map((e) => {
    const j = e.jobId && jobById(db, e.jobId);
    return { at: e.at, text: e.text, org: e.actor.kind === 'system' ? '자동' : e.actor.org, textbook: j ? tbOf(db, j).title : '', jobId: e.jobId, content: e.content };
  });
  const to = new Date(new Date(from).getTime() + 7 * 864e5 - 1).toISOString();
  const inWeek = (at) => at >= from && at <= now;
  // 단위를 섞지 않음: 신규 등록·운영 반영 = 작업 수 / 서버 반영·검수 = 콘텐츠·회차 수(같은 회차 반복은 1건, 취소분 제외)
  const stagedKeys = new Set(db.jobs.flatMap((j) => j.staging.filter((s) => !s.cancelled && inWeek(s.at)).map((s) => `${j.id}|${s.content}|${s.round}`)));
  const prodJobs = new Set(db.jobs.filter((j) => live(j.prods).some((p) => inWeek(p.at))).map((j) => j.id));
  return {
    from, to,
    created: new Set(evs.filter((e) => e.type === 'job_created').map((e) => e.jobId)).size,
    staged: stagedKeys.size, reviewed: distinct('reviewed'), prod: prodJobs.size,
    reviewWaiting: tasks.filter((x) => x.kind === 'review').reduce((n, x) => n + x.reviewContents.length, 0),
    recent,
  };
}

// ───────── 작업 흐름(상세 화면) ─────────
function flow(db, job) {
  const t = job.targets, lanes = [];
  const S = (label, done, org) => ({ label, done, org });
  if (t.ebook) lanes.push({ content: 'ebook', steps: [S('수정 이북 업로드', roundHasFiles(db, job, 'ebook'), '블루가 이북'), S('전자저작물과 함께 검수', reviewOk(db, job, 'ebook'), '편집팀')] });
  if (t.digital) {
    const st = [];
    if (t.ebook) st.push(S('수정 이북 업체 전달', deliveryValid(job), '편집팀'));
    st.push(S('업체 제작 → OneDrive 등록', roundHasFiles(db, job, 'digital') && !missingSlots(db, job).length && !baseMismatch(db, job, 'digital').length, '편집팀'));
    st.push(S('테스트 서버 업로드', stagingValid(db, job, 'digital'), '스퀘어네트'));
    if (jsonNeeded(db, job)) st.push(S('bookUpdate.json 반영', jsonState(db, job) === 'deployed', db.settings.jsonOwnerOrg));
    st.push(S('검수', reviewOk(db, job, 'digital'), '편집팀'));
    lanes.push({ content: 'digital', steps: st });
  }
  if (t.connecting) lanes.push({ content: 'connecting', steps: [
    S('수정본 업로드', roundHasFiles(db, job, 'connecting') && !baseMismatch(db, job, 'connecting').length, '블루가 커넥팅북'),
    S('테스트 서버 반영', stagingValid(db, job, 'connecting'), '스퀘어네트'),
    S('검수', reviewOk(db, job, 'connecting'), '편집팀'),
  ] });
  const fin = [S('최종 확정', !!job.closedAt || finalizeValid(db, job), '편집팀'), S('운영 서버 반영', !!job.closedAt || prodValid(db, job), '스퀘어네트'), S('운영 결과 확인', !!job.closedAt, '편집팀')];
  if (job.closedAt) for (const l of lanes) for (const s of l.steps) s.done = true;
  return { lanes, fin };
}

// ───────── 작업 등록 ─────────
// 교과서 이력: 완료 버전 · 진행 중 작업 · 지난 작업(버전 배열만으로 신규 판단하지 않음)
function textbookHistory(db, tb) {
  const jobs = db.jobs.filter((j) => j.textbookId === tb.id);
  return { versions: tb.versions.length, active: jobs.filter((j) => !j.closedAt), jobs: jobs.length, any: tb.versions.length > 0 || jobs.length > 0 };
}
// 처리가 시작된 작업인지(파일 등록·전달·서버 반영·검수·확정 중 하나라도)
function jobHasProgress(db, job) {
  return db.files.some((f) => f.jobId === job.id) || job.deliveries.length > 0 || job.staging.length > 0 || job.reviews.length > 0 || job.finalizations.length > 0 || (job.cumulChecks || []).length > 0;
}
// 교과서 현재 적용 정보(쇄차·다운로드 버전·업데이트 버전·최종수정일·저자) + 편집팀 담당자. 변경 전후 기록
const INFO_FIELDS = { author: '저자', curriculum: '개정 시기', vendor: '전자저작물 제작 업체', printRun: '쇄차', downloadVersion: '전자저작물 다운로드', updateVersion: '전자저작물 업데이트 파일', lastModified: '최종수정일' };
function setTextbookInfo(db, ctx, a) {
  const tb = db.textbooks.find((t) => t.id === a.textbookId);
  if (!tb) throw new UserError('교과서를 찾을 수 없습니다');
  if (['스퀘어네트', '블루가 이북', '블루가 커넥팅북'].includes(ctx.actor?.org)) throw new UserError('편집팀과 AI랩만 수정할 수 있습니다');
  if (!(ctx.actor?.name || '').trim() && !(ctx.actor?.orgOnlyTask && ctx.actor?.org)) throw new UserError('소속 조직을 선택하세요');
  const by = { org: ctx.actor?.org || null, name: (ctx.actor?.name || '').trim() || null };
  const cur = tb.info || {}, next = {};
  for (const k of Object.keys(INFO_FIELDS)) {
    let v = String(a.info?.[k] ?? cur[k] ?? '').trim();
    if (v.length > 50) throw new UserError(`${INFO_FIELDS[k]}은(는) 50자까지 쓸 수 있어요`, { field: k });
    if (k === 'printRun' && /^\d+$/.test(v)) v += '쇄';
    if (k === 'lastModified' && v && !/^\d{4}-\d{2}-\d{2}$/.test(v)) throw new UserError('최종수정일 형식을 확인하세요', { field: k });
    next[k] = v;
  }
  const changed = Object.keys(INFO_FIELDS).filter((k) => (cur[k] || '') !== next[k]);
  if (changed.length) {
    tb.info = next;
    tb.infoLog = [...(tb.infoLog || []), { at: ctx.now, by, changes: changed.map((k) => ({ key: k, from: cur[k] || '', to: next[k] })) }];
  }
  // 편집팀 담당자: 진행 중 작업이 있으면 그 작업에 지정, 없으면 다음 작업 기본값
  const editor = a.editor === undefined ? null : String(a.editor).trim();
  if (editor !== null) {
    const active = db.jobs.filter((j) => j.textbookId === tb.id && !j.closedAt);
    for (const j of active) if (editor && j.assignees['편집팀'] !== editor) act(db, ctx, { type: 'assign', jobId: j.id, org: '편집팀', name: editor });
    if (editor !== (tb.defaultEditor || '')) tb.defaultEditor = editor;
  }
  return tb;
}
function nextVersion(db, tb) {
  const used = [...tb.versions.map((v) => vnum(v.version)), ...db.jobs.filter((j) => j.textbookId === tb.id).map((j) => vnum(j.version))];
  return 'V' + (used.length ? Math.max(...used) + 1 : 1);
}
function createJob(db, ctx, input) {
  if (!['편집팀', 'AI랩'].includes(ctx.actor?.org)) throw new UserError('편집팀과 AI랩만 수정을 시작할 수 있습니다');
  if (input.kind === '수정' && !(input.newItems || []).some((x) => String(x).trim())) throw new UserError('이번 수정 사항을 입력하세요', { field: 'items' });
  let tb = input.textbookId ? db.textbooks.find((x) => x.id === input.textbookId) : null;
  let created = false;
  const F = (field, msg, extra) => new UserError(msg, { field, ...extra });
  if (input.textbookId && !tb) throw F('textbook', '교과서를 찾을 수 없습니다');
  const approval = tb ? tb.approval || input.approval : null;
  if (tb && !['검정', '인정'].includes(approval)) throw F('approval', '검정·인정을 선택하세요');
  if (!tb) {
    const n = input.textbook || {};
    if (!input.textbook) throw F('textbook', '교과서를 선택하세요');
    const MSG = { level: '학교급을 선택하세요', subject: '과목을 선택하세요', title: '교과서명을 입력하세요', code: '식별번호를 입력하세요', approval: '검정·인정을 선택하세요' };
    for (const k of ['level', 'subject', 'title', 'code', 'approval']) if (!String(n[k] || '').trim()) throw F(k, MSG[k]);
    if (!LEVEL_FOLDER[n.level]) throw F('level', MSG.level);
    if (!SUBJECTS[n.level].includes(n.subject.trim())) throw F('subject', '과목을 목록에서 선택하세요');
    if (!['검정', '인정'].includes(n.approval)) throw F('approval', MSG.approval);
    if (/[\/:*?"<>|]/.test(n.title)) throw F('title', '교과서명에 폴더 이름으로 쓸 수 없는 문자가 있습니다');
    if (db.textbooks.some((x) => x.title === n.title.trim() && x.level === n.level)) throw F('title', '같은 이름의 교과서가 있습니다. 검색해서 선택하세요');
    const code = n.code.trim();
    if (!/^[A-Za-z0-9-]+$/.test(code)) throw F('code', '식별번호는 영문·숫자·하이픈만 사용할 수 있습니다');
    if (db.textbooks.some((x) => x.code === code)) throw F('code', '이미 등록된 식별번호입니다. 검색해서 선택하세요');
    tb = { id: nextId(db, 'tb'), code, level: n.level.trim(), subject: n.subject.trim(), title: n.title.trim(), approval: n.approval, versions: [] };
    created = true;
  }
  // 이북을 고르면 전자저작물·커넥팅북도 반드시 함께(화면 값과 관계없이 서버에서 다시 맞춤)
  const targets = normalizeTargets(input.targets);
  if (!CONTENTS.some((c) => targets[c])) throw F('targets', '수정 대상을 선택하세요');
  // 신규·수정 판단: 버전 이력 + 이 교과서의 기존 작업(진행 중 포함)
  const hist = textbookHistory(db, tb);
  const kind = input.kind || (hist.any ? '수정' : '신규');
  if (!['신규', '수정'].includes(kind)) throw F('kind', '구분을 선택하세요');
  if (kind === '신규' && hist.any) throw F('kind', '이전 버전 또는 진행 이력이 있는 교과서입니다. 기존 교과서 수정으로 등록하세요');
  // 업무 폴더 = 수정고시 회차 폴더. 업데이트 버전(V3 등)은 관리 페이지 안에서만 사용
  const folderKey = String(input.cycle || db.settings.cycle || '').trim();
  if (!folderKey) throw F('cycle', '수정고시 회차를 선택하세요');
  if (/[\/:*?"<>|]/.test(folderKey)) throw F('cycle', '회차 이름에 폴더 이름으로 쓸 수 없는 문자가 있습니다');
  // 같은 교과서·같은 회차의 진행 중 작업만 중복으로 막음(같은 OneDrive 폴더를 쓰므로). 다른 회차의 새 버전은 등록 가능
  const dup = hist.active.find((j) => j.folderKey === folderKey);
  if (dup) throw F('textbook', `이 교과서는 '${folderKey}' 작업이 이미 진행 중입니다`, { jobId: dup.id });
  if (input.due && !/^\d{4}-\d{2}-\d{2}$/.test(input.due)) throw F('due', '기한 형식을 확인하세요');
  if (created) db.textbooks.push(tb);
  if (approval) tb.approval = approval;
  const version = targets.digital ? nextVersion(db, tb) : null;
  const prevJob = last(db.jobs.filter((j) => j.textbookId === tb.id));
  const assignee = (input.assignee || '').trim() || tb.defaultEditor || prevJob?.assignees['편집팀'] || '';
  const job = {
    id: nextId(db, 'J'), textbookId: tb.id, kind, version, folderKey, targets, selected: { ...targets },
    due: input.due || null, assignees: { 편집팀: assignee }, assigneeLog: [],
    newItems: (input.newItems || []).map((s) => String(s).trim()).filter(Boolean),
    createdAt: ctx.now, rounds: { ebook: 1, digital: 1, connecting: 1 }, roundLog: [], ebookRev: 0,
    deliveries: [], staging: [], reviews: [], cumulChecks: [], sizeAcks: [], finalizations: [], prods: [], prodConfirms: [], closedAt: null,
  };
  db.jobs.push(job);
  log(db, ctx, 'job_created', { jobId: job.id, text: `업데이트 작업 등록 · ${targetsLabel(targets).join('·')}${version ? ' · ' + version : ''}` });
  return job;
}

// ───────── 담당자 처리 동작 ─────────
function act(db, ctx, a) {
  if (NAME_REQUIRED.has(a.type) && !(ctx.actor?.name || '').trim() && !(ctx.actor?.orgOnlyTask && ctx.actor?.org)) throw new UserError('처리자 이름을 입력하세요');
  const by = { org: ctx.actor?.org || null, name: (ctx.actor?.name || '').trim() || null };
  const now = ctx.now;
  if (a.type === 'linkUnmatched' || a.type === 'ignoreUnmatched') return unmatchedAction(db, ctx, a, by);
  if (a.type === 'jsonDeploy') return jsonDeploy(db, ctx, by);
  const job = jobById(db, a.jobId);
  if (!job) throw new UserError('작업을 찾을 수 없습니다');
  const tb = tbOf(db, job);
  const d = derive(db, job, now);
  const need = (kind, content) => {
    const task = d.tasks.find((x) => x.kind === kind && (!content || x.content === content));
    if (!task) throw new UserError('이미 처리되었거나 진행 상태가 바뀌었습니다. 화면을 새로 고쳐 확인하세요');
    return task;
  };
  const L = (type, f) => log(db, ctx, type, { jobId: job.id, ...f });
  const ex = a.expect || null;
  const stale = () => { throw new UserError('처리 대상 파일이 바뀌었습니다. 화면을 새로 고친 뒤 다시 확인하세요'); };
  if (ex) {
    if (ex.ebookRev != null && ex.ebookRev !== job.ebookRev) stale();
    if (ex.round != null && a.content && ex.round !== job.rounds[a.content]) stale();
    if (ex.fp != null && a.content && ex.fp !== fp(db, job, a.content)) stale();
    if (ex.jobFp != null && ex.jobFp !== jobFp(db, job)) stale();
  }

  switch (a.type) {
    case 'deliver': {
      need('deliver');
      job.deliveries.push({ ebookRev: job.ebookRev, at: now, by });
      L('delivered', { content: 'digital', round: job.ebookRev, text: `이북 수정본 ${job.ebookRev} 외부 업체 전달` });
      break;
    }
    case 'stage': {
      need('stage', a.content);
      const c = a.content;
      job.staging.push({ content: c, round: job.rounds[c], fp: fp(db, job, c), at: now, by, mode: 'manual' });
      L('staged', { content: c, round: job.rounds[c], text: `${CONTENT_LABEL[c]} 테스트 서버 반영 완료 ` });
      break;
    }
    case 'review': {
      const res = a.results || {};
      const keys = Object.keys(res);
      if (!keys.length) throw new UserError('검수 결과를 선택하세요');
      for (const c of keys) {
        const task = d.tasks.find((x) => x.kind === 'review' && x.reviewContents.includes(c));
        if (!task) throw new UserError(`${CONTENT_LABEL[c] || c}: 이미 처리되었거나 아직 검수할 단계가 아닙니다`);
        const r = res[c];
        if (!['ok', 'fix'].includes(r.result)) throw new UserError('검수 결과를 선택하세요');
        if (r.result === 'fix' && !(r.note || '').trim()) throw new UserError('수정 필요 내용을 입력하세요');
      }

    deliver: '수정 이북 업체 전달', stage: `${CL[a.content] || ''} 테스트 서버 업로드`, prod: '운영 서버 반영', prodConfirm: '운영 반영 결과 확인',
    jsonAdd: 'bookUpdate.json 항목 추가', jsonDeploy: 'bookUpdate.json 서버 반영', finalize: '최종 확정', sizeAck: '용량 감소 확인',
    cumulative: '이전 수정 내용 확인', testUpload: `${CL[a.content] || ''} 파일 올림`,
    review: `${Object.keys(a.results || {}).map((c) => CL[c]).join('·')} 검수`,
  })[a.type];

// 빠진 항목: 안내를 띄우고 그 자리로 이동해 빨간 테두리로 표시(고치면 사라짐)

  const off = () => { el.classList.remove('need'); el.removeEventListener('input', off); el.removeEventListener('change', off); };

  try {

    if (!inlineStage) toast(body.action ? doneMsg(r, body.action) : r.message || '처리되었습니다');
    // 작업 화면에서 처리했으면 '방금 처리한 작업 · 다음 담당'을 업무 칸 위에 표시

      done: ['testUpload', 'deliver', 'prod', 'prodConfirm', 'jsonDeploy'].includes(body.action?.type),

}

function stepsToGoal(j, stage) {
  if (!j) return [];
  const out = [];
  const cut = { test: /테스트 서버/, review: /검수/ }[stage];
  for (const l of j.flow.lanes) {
    let idx = l.steps.length - 1;
    if (cut) { const k = l.steps.findIndex((x) => cut.test(x.label)); if (k < 0) continue; idx = k; }
    if (stage === 'test' && l.content === 'ebook') { const k = l.steps.findIndex((x) => /업로드/.test(x.label)); if (k < 0) continue; idx = k; }
    l.steps.slice(0, idx + 1).filter((x) => !x.done).forEach((x) => out.push({ org: x.org, label: `${CL[l.content]} ${easy(x.label)}` }));
  }
  if (stage === 'final' || stage === 'prod') j.flow.fin.slice(0, stage === 'final' ? 1 : 2).filter((x) => !x.done).forEach((x) => out.push({ org: x.org, label: easy(x.label) }));
  return out;
}

    const done = j ? stageDone(j, it.stage) : !!goalBook?.done;
    const unknown = !j && !goalBook;
    return { ...it, j, goalBook, done, unknown, late: !unknown && !done && !!it.due && it.due < today }; };
  const rows = goalItems(g).map(row);

}

function drawSearch() {

    .some((value) => flat(value).includes(q)));

document.addEventListener('submit', async (e) => {

    });

    if (r) S.gd = null;
    return;
  }
  if (kind === 'unmatched') { S.actOrg = 'AI랩'; S.adLink = null; return doAct({ type: 'linkUnmatched', unmatchedId: f.dataset.u, jobId: fd.get('jobId'), content: fd.get('content'), slot: fd.get('slot') }); }

  if (kind === 'devfail') return doPost('/api/admin/sample', { type: e.submitter?.value, jobId: fd.get('jobId') });
  if (kind === 'memo') { const v = fd.get('text').trim(), org = fd.get('org'); if (!org) return toast('소속 조직을 선택하세요', true); if (v) sendMemo(v, org); return; }
  if (kind === 'assignHead') { S.actOrg = '편집팀'; return doAct({ type: 'assign', jobId: S.detail.job.id, org: '편집팀', name: fd.get('name') }); }
  const t = findTask(S.open);
  if (!t) return;
  if (kind === 'review') {
    const results = {};
    for (const c of t.reviewContents) {
      const r = fd.get('r_' + c);
      if (!r) return failAt(f.querySelector(`[name="r_${c}"]`).closest('.seg2'), `${CL[c]} 검수 결과를 선택하세요`);

      results[c] = { result: r, note: fd.get('n_' + c) || '', ref: fd.get('ref_' + c) || '' };
    }

// 편집팀 메일은 편집팀 안의 과목만 고를 수 있고, 업체·AI랩 메일은 자기 조직으로 고정. 관리자 로그인은 제한 없음
// 보기용 HTML에서는 계정 목록을 이 브라우저에 저장(서버 적용 시 서버 저장으로 바꿈)
const LOGIN_ON = false; // 로그인창 임시로 끔. 다시 쓰려면 true
const ACC_KEY = 'um_accounts', LOGIN_KEY = 'um_login';
const ACC_SAMPLE = [
  { email: 'editor@ybm.co.kr', org: '편집팀' }, { email: 'ailab@ybm.co.kr', org: 'AI랩' },
  { email: 'squarenet@example.com', org: '스퀘어네트' }, { email: 'ebook@example.com', org: '블루가 이북' }, { email: 'connect@example.com', org: '블루가 커넥팅북' },
];
const accList = () => { try { const v = JSON.parse(localStorage.getItem(ACC_KEY) || 'null'); if (Array.isArray(v)) return v; } catch {} return ACC_SAMPLE.map((x) => ({ ...x })); };
const accSave = (v) => { try { localStorage.setItem(ACC_KEY, JSON.stringify(v)); } catch {} };
const normMail = (m) => String(m || '').trim().toLowerCase();
const loginMail = () => { if (!LOGIN_ON) return ''; try { return localStorage.getItem(LOGIN_KEY) || ''; } catch { return ''; } };
const curAcc = () => { const m = loginMail(); return m ? accList().find((a) => a.email === m) || null : null; };
function applyAcc(acc) {
  const allowed = acc.org === '편집팀' ? (S.org === '편집팀' || isTeam(S.org)) : S.org === acc.org;
  if (!allowed) { S.org = acc.org; store.set('um_org', S.org); }
  S.orgSet = true; store.set('um_org_set', '1');
}
function loginGate(h) {
  if (!LOGIN_ON) { document.body.classList.remove('nolog'); return true; }
  const acc = curAcc();
  document.body.classList.toggle('nolog', !acc && !S.admin.ok);
  if (acc) { applyAcc(acc); return true; }
  if (loginMail()) { try { localStorage.removeItem(LOGIN_KEY); } catch {} } // 권한이 빠진 메일은 로그아웃
  if (S.admin.ok) return true;
  if (h.startsWith('/admin') && S.loginTab === 'admin') return true;
  drawMailLogin();
  return false;
}
function drawMailLogin(msg) {
  const adm = S.loginTab === 'admin';
  $('#app').innerHTML = `<div class="lgw"><div class="lgc">
    <div class="lgl"><i>U</i><h1>업데이트 관리</h1></div>
    <div class="lgt"><button class="${adm ? '' : 'on'}" data-lgtab="mail">부서원 로그인</button><button class="${adm ? 'on' : ''}" data-lgtab="admin">관리자 로그인</button></div>
    ${adm ? `<form data-form="lgadmin"><label>관리자 비밀번호<input class="inp ${msg ? 'bad' : ''}" type="password" name="password" autocomplete="current-password"></label>`
          : `<form data-form="lgmail"><label>메일 주소<input class="inp ${msg ? 'bad' : ''}" type="email" name="email" placeholder="name@ybm.co.kr" autocomplete="email" value="${esc(S.lgMail || '')}"></label>`}
    ${msg ? `<div class="ferr">${esc(msg)}</div>` : ''}<button class="btn-primary lgb">로그인</button></form></div></div>`;
  $('.lgc input').focus();
}
function limitOrgSel(sel) {
  const acc = curAcc();
  let who = $('#whoBox');
  if (!who) { $('.orgsel').insertAdjacentHTML('afterend', '<span class="who" id="whoBox"></span>'); who = $('#whoBox'); }
  who.innerHTML = acc ? `<span class="who-m">${esc(acc.email)}</span><button class="lnk" data-logout="1">로그아웃</button>` : '';
  const ok = (v) => !acc || (acc.org === '편집팀' ? v === '편집팀' || v.startsWith('편집팀:') : v === acc.org);
  for (const o of sel.querySelectorAll('option')) { o.hidden = !ok(o.value || o.textContent === '전체' && o.value); o.disabled = o.hidden; }
  for (const gp of sel.querySelectorAll('optgroup')) gp.hidden = acc && acc.org !== '편집팀';
  sel.disabled = !!acc && acc.org !== '편집팀';
}
// 관리자 > 접근 권한: 메일 · 조직 추가 / 조직 변경 / 삭제
function adAccess() {
  const list = accList(), err = S.adErr.acc;
  const orgOpt = (v) => ORGS.map((o) => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('');
  return `<section class="sec"><div class="sech"><h2>접근 권한 <span class="n">${list.length}</span></h2></div>
    <form data-form="accadd" class="accadd"><input class="inp ${err ? 'bad' : ''}" name="email" type="email" placeholder="메일 주소"><select class="inp" name="org">${orgOpt('편집팀')}</select><button class="btn-primary">추가</button></form>
    ${err ? `<div class="ferr">${esc(err)}</div>` : ''}
    <table class="tb acctb"><thead><tr><th>메일 주소</th><th>조직</th><th></th></tr></thead><tbody>
    ${list.map((a, i) => `<tr><td>${esc(a.email)}</td><td><select class="inp sm" data-accorg="${i}">${orgOpt(a.org)}</select></td><td><button class="lnk del" data-accdel="${i}">삭제</button></td></tr>`).join('') || '<tr><td colspan="3" class="sub">등록된 메일 없음</td></tr>'}
    </tbody></table></section>`;
}
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-lgtab],[data-logout],[data-accdel]');
  if (!b) return;
  e.preventDefault(); e.stopPropagation();
  if (b.dataset.lgtab) { S.loginTab = b.dataset.lgtab; return drawMailLogin(); }
  if (b.dataset.logout) { try { localStorage.removeItem(LOGIN_KEY); } catch {} S.loginTab = 'mail'; location.hash = '#/'; return route(); }
  if (b.dataset.accdel != null) { const v = accList(); const [x] = v.splice(Number(b.dataset.accdel), 1); accSave(v); toast(`${x.email} 접근 권한 삭제`); return drawAdmin(); }
}, true);
document.addEventListener('change', (e) => {
  const r = e.target;
  if (r.dataset?.accorg == null) return;
  e.stopPropagation();
  const v = accList(); v[Number(r.dataset.accorg)].org = r.value; accSave(v); toast('조직 변경됨');
}, true);
document.addEventListener('submit', async (e) => {
  const f = e.target, kind = f.dataset?.form;
  if (!['lgmail', 'lgadmin', 'accadd'].includes(kind)) return;
  e.preventDefault(); e.stopPropagation();
  const fd = new FormData(f);
  if (kind === 'lgmail') {
    const m = normMail(fd.get('email')); S.lgMail = m;
    if (!m) return drawMailLogin('메일 주소를 입력하세요');
    const acc = accList().find((a) => a.email === m);
    if (!acc) return drawMailLogin('접근 권한이 없는 메일입니다. 관리자에게 요청하세요');
    try { localStorage.setItem(LOGIN_KEY, m); } catch {}
    S.org = ''; applyAcc(acc); location.hash = '#/'; return route();
  }
  if (kind === 'lgadmin') {
    try { await post('/api/admin/login', { password: fd.get('password') }); S.admin.ok = true; document.body.classList.remove('nolog'); location.hash = '#/admin'; return route(); }
    catch (er) { return drawMailLogin(er.message); }
  }
  if (kind === 'accadd') {
    const m = normMail(fd.get('email')), org = fd.get('org'), v = accList();
    S.adErr = {};
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)) S.adErr.acc = '메일 주소 형식이 아닙니다';
    else if (v.some((a) => a.email === m)) S.adErr.acc = '이미 등록된 메일입니다';
    if (S.adErr.acc) return drawAdmin();
    v.push({ email: m, org }); accSave(v); toast(`${m} 추가 · ${org}`); return drawAdmin();
  }
}, true);

window.addEventListener('hashchange', route);
route();
setInterval(async () => {
  if (S.open || S.adEdit || document.hidden || !$('#dim').hidden || ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) return;
  if (pathOf() === '/new' || pathOf().startsWith('/book/') || S.infoEdit || S.scopeEdit) return;
  try { await checkAdmin(); await rerender(); } catch {}
}, 15000);

</script>

<script>
// ───────── 업무 흐름 가이드 팝업 ─────────
// 한 장에 한 가지 이야기. 화살표 버튼·키보드 ←→·점으로 넘김. 처음 한 번 자동으로 열고 이후에는 상단 '업무 흐름' 버튼
// 담당 조직을 골랐으면 내 조직 단계에 파란 테두리
(function () {
  const myOrg = () => { try { const o = (typeof S !== 'undefined' && S.org) || ''; return o.startsWith('편집팀') ? '편집팀' : o; } catch { return ''; } };
  const esc2 = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const mineCls = (orgs) => ([].concat(orgs).includes(myOrg()) ? 'fgme' : '');
  const step = (name, orgs) => `<div class="fgk ${mineCls(orgs)}"><b>${esc2(name)}</b><em>${orgs.map(esc2).join('<br>')}</em></div>`;
  const PAGES = [
    { t: '수정은 이 순서로 진행합니다', l: '내 차례가 되면 메인 화면에 할 일이 나타납니다. 이북을 고치지 않을 때는 제작부터 시작합니다.',
      c: () => `<div class="fgp-s mini">${[step('이북 수정', ['블루가 이북']), `<div class="fgk2">${step('전자저작물 제작', ['편집팀'])}${step('커넥팅북 제작', ['블루가 커넥팅북'])}</div>`, step('테스트 서버', ['스퀘어네트']), step('검수', ['편집팀']), step('확정', ['편집팀']), step('운영', ['스퀘어네트', '편집팀'])].join('<i>→</i>')}</div>` },
    { t: '이럴 때는 다시 작업합니다', l: '',
      c: () => `<div class="fgl3">${[['검수사항 반영 요청을 받았을 때', '해당 결과물을 고쳐 다시 올립니다.'], ['이북을 다시 올렸을 때', '전자저작물과 커넥팅북도 새 이북에 맞춰 다시 작업합니다.'], ['확정한 뒤 파일이 바뀌었을 때', '바뀐 결과물을 다시 검수하고 확정합니다.']].map(([b, x]) => `<div><b>${b}</b><p>${x}</p></div>`).join('')}</div>` },
    { t: '진행현황은 이렇게 읽습니다', l: '',
      c: () => `<div class="fgx"><div class="fgx-g">${[['w', '차례', '해당 조직이 처리할 차례입니다.'], ['c', '진행 중', '제작 업체나 블루가에서 작업하고 있습니다.'], ['k', '확인 필요', '파일 용량 감소나 누락 등 확인할 문제가 있습니다.'], ['x', '수정 필요', '수정 요청을 받아 다시 작업해야 합니다.']].map(([k, n, x]) => `<div><span class="fgcell ${k}">${n}</span><p>${x}</p></div>`).join('')}</div>
        <div class="fgx-n"><span><b>✓</b>끝난 단계</span><span><b>—</b>해당 없는 단계</span><span><b>빈칸</b>아직 시작하지 않은 단계</span></div></div>` },
  ];
  let cur = 0;
  const last = PAGES.length - 1;
  const box = document.createElement('div');
  box.className = 'fgd'; box.id = 'flowGuide'; box.hidden = true;
  document.body.appendChild(box);
  function draw() {
    const g = PAGES[cur];
    const arrow = (d) => `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
    box.innerHTML = `<div class="fgm" role="dialog" aria-modal="true" aria-label="업무 흐름">
      <div class="fgm-h"><i>U</i><b>업데이트 관리</b><button class="x" type="button" data-fgclose="1" aria-label="닫기">${arrow('M6 6l12 12M18 6L6 18')}</button></div>
      <div class="fgp">${g.c()}</div>
      <div class="fgt"><b>${g.t}</b>${g.l ? `<span>${g.l}</span>` : ''}</div>
      <div class="fgm-f"><button class="fgnav" type="button" data-fggo="${cur - 1}" ${cur === 0 ? 'disabled' : ''} aria-label="이전">${arrow('M19 12H5M11 6l-6 6 6 6')}</button>
        <div class="fgdots">${PAGES.map((x, i) => `<button type="button" class="${i === cur ? 'on' : ''}" data-fggo="${i}" aria-label="${i + 1}번째 장"></button>`).join('')}</div>
        <button class="fgnav" type="button" data-fggo="${cur + 1}" ${cur === last ? 'disabled' : ''} aria-label="다음">${arrow('M5 12h14M13 6l6 6-6 6')}</button></div></div>`;
  }
  const go = (n) => { cur = Math.max(0, Math.min(last, n)); draw(); };
  const open = () => { go(0); box.hidden = false; try { localStorage.setItem('um_flow_guide_seen', '1'); } catch {} };
  const close = () => { box.hidden = true; };
  document.getElementById('flowGuideBtn').addEventListener('click', open);
  box.addEventListener('click', (e) => {
    if (e.target === box || e.target.closest('[data-fgclose]')) return close();
    const b = e.target.closest('[data-fggo]'); if (b) go(Number(b.dataset.fggo));
  });
  document.addEventListener('keydown', (e) => {
    if (box.hidden) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowRight') { e.preventDefault(); go(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); go(cur - 1); }
  });
  let seen = false; try { seen = !!localStorage.getItem('um_flow_guide_seen'); } catch {}
  if (!seen) setTimeout(() => { if (!document.body.classList.contains('nolog')) open(); }, 600);
})();
</script>

<script>
// 로고(업데이트 관리)를 누르면 어느 화면에서든 홈으로: 이미 홈이면 다시 그리고 맨 위로
document.querySelector('.hd .logo').addEventListener('click', (e) => {
  e.preventDefault();
  const fg = document.getElementById('flowGuide'); if (fg) fg.hidden = true;
  try { if (typeof S !== 'undefined') { S.open = null; S.ftAll = false;
    // 담당 조직도 가장 넓은 범위로: 관리자·비로그인 = 전체 / 편집팀 메일 = 편집팀 전체 / 업체·AI랩 메일 = 자기 조직(고정)
    const acc = typeof curAcc === 'function' ? curAcc() : null;
    const org = !acc || S.admin?.ok ? '' : acc.org;
    S.org = org; try { localStorage.setItem('um_org', org); } catch {}
    const sel = document.getElementById('orgSel'); if (sel) sel.value = org;
  } } catch {}
  const top = () => { document.querySelector('main')?.scrollTo(0, 0); window.scrollTo(0, 0); };
  if (location.hash === '#/' || location.hash === '' || location.hash === '#') { if (typeof route === 'function') route().then(top); else top(); }
  else { location.hash = '#/'; setTimeout(top, 50); }
});
</script>
